# Runs the whole app: PostgreSQL, the Flask API, and the React frontend.
# Settings come from .env next to this file (copy .env.example) and from backend/.env.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ passes the variable through to the container's own environment
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    # Secrets, Gmail, the campaign allow-list and the demo seed settings
    env_file:
      - ./backend/.env
    # These replace the local-development values in backend/.env with the container ones. The fixed
    # values are written here, not read from .env, so a variable left in the shell cannot change them.
    environment:
      # Gunicorn runs the app, never the Flask debugger
      FLASK_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in .env}
      BACKEND_URL: ${BACKEND_URL:?Set BACKEND_URL in .env}
      PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL:?Set PUBLIC_BACKEND_URL in .env}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:?Set MAX_UPLOAD_MB in .env}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:?Set REQUEST_TIMEOUT_SECONDS in .env}
      # The demo seed reads its email and SMS dataset files from the folder mounted below
      DEMO_DATASET_DIR: /app/demo_datasets
      # nginx sits in front of the API: trust its forwarded client address (rate limits) and https flag
      TRUSTED_PROXY_COUNT: 1
      # Login cookies are only sent over HTTPS or to localhost unless this is false
      COOKIE_SECURE: ${COOKIE_SECURE:?Set COOKIE_SECURE in .env}
    volumes:
      # Uploaded datasets are kept between restarts, like the database
      - uploads_data:/app/uploads
      # Your dataset folder on this computer, read-only: the demo scenarios are imported from it
      - ${DEMO_DATASETS_HOST_DIR:?Set DEMO_DATASETS_HOST_DIR in .env}:/app/demo_datasets:ro
    # Only this computer reaches the API directly (campaign links and the tracking pixel); the app itself goes
    # through nginx on the frontend port. A request sent straight here could claim any client address in
    # X-Forwarded-For, so this port never listens on the network.
    ports:
      - "127.0.0.1:${BACKEND_PORT:?Set BACKEND_PORT in .env}:5000"
    # "health: starting" while the first start loads the demo data (a few minutes); healthy once the API answers
    # and the loading marker from entrypoint.sh is gone
    healthcheck:
      test: ["CMD", "python", "-c", "import os, socket, sys; socket.create_connection(('127.0.0.1', 5000), 3); sys.exit(os.path.exists('/tmp/phishsim-setting-up'))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15m
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:?Set VITE_API_URL in .env}
    restart: unless-stopped
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS}
    ports:
      - "${HOST_IP:?Set HOST_IP in .env}:${FRONTEND_PORT:?Set FRONTEND_PORT in .env}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
