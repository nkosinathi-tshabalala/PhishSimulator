# Runs the whole app: PostgreSQL, the Flask API, and the React frontend.
# Settings come from .env next to this file (copy .env.example) and from backend/.env.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ passes the variable through to the container's own environment
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    # Secrets, Gmail, the campaign allow-list and the demo seed settings
    env_file:
      - ./backend/.env
    # These replace the local-development values in backend/.env with the container ones
    environment:
      FLASK_ENV: ${FLASK_ENV:?Set FLASK_ENV in .env}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in .env}
      BACKEND_URL: ${BACKEND_URL:?Set BACKEND_URL in .env}
      PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL:?Set PUBLIC_BACKEND_URL in .env}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:?Set MAX_UPLOAD_MB in .env}
    volumes:
      # Uploaded datasets are kept between restarts, like the database
      - uploads_data:/app/uploads
    ports:
      - "${HOST_IP:?Set HOST_IP in .env}:${BACKEND_PORT:?Set BACKEND_PORT in .env}:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:?Set VITE_API_URL in .env}
    restart: unless-stopped
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB}
    ports:
      - "${HOST_IP}:${FRONTEND_PORT:?Set FRONTEND_PORT in .env}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
